<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeshCore — carte des régions</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: #fafafa;
      color: #000;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      flex: 0 0 auto;
    }
    header h1 { margin: 0; font-size: 1.4em; }
    header p { margin: 2px 0 0; font-size: 0.95em; }
    header a { color: #00e; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 0;
    }
    aside {
      padding: 12px;
      border-right: 1px solid #ddd;
      overflow: auto;
    }
    #map { min-height: 0; background: #ccc; }
    label { display: block; margin: 0 0 4px; }
    input[type="search"] {
      width: 100%;
      font: inherit;
      padding: 6px;
      margin-bottom: 12px;
    }
    .opts { margin: 0 0 12px; }
    .opts label {
      margin: 0 0 6px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .place { margin: 0 0 8px; font-weight: bold; }
    .codes { margin: 0 0 12px; }
    .codes div { margin: 0 0 4px; }
    .k { color: #555; display: inline-block; width: 110px; }
    code {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      font: 12px/1.4 "Courier New", Courier, monospace;
      padding: 6px;
      resize: vertical;
    }
    aside > button {
      font: inherit;
      padding: 6px 12px;
      margin-top: 8px;
      cursor: pointer;
      background: #eee;
      border: 1px solid #999;
    }
    .note { min-height: 1.2em; margin: 6px 0 0; color: #006400; font-size: 0.9em; }
    .hint { color: #555; font-size: 0.9em; margin: 14px 0 0; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #ddd; max-height: 46vh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MeshCore — carte des régions</h1>
      <p>France métropolitaine — commandes CLI répéteur</p>
    </div>
    <a href="/">Retour au portail</a>
  </header>
  <div class="layout">
    <aside>
      <label for="search">Recherche</label>
      <input id="search" type="search" placeholder="Loire, 42, fr-42…" autocomplete="off" />

      <div class="opts">
        <label><input id="include-dept" type="checkbox" checked /> Inclure le département (<code>fr-42</code>)</label>
        <label><input id="include-allowf" type="checkbox" checked /> Ajouter <code>region allowf</code> (firmware &lt; 1.15)</label>
        <label><input id="include-home" type="checkbox" /> Définir <code>region home</code></label>
      </div>

      <p class="place" id="place">Chargement de la carte…</p>
      <div class="codes" id="codes"></div>

      <label for="commands">Commandes à coller dans la CLI</label>
      <textarea id="commands" readonly spellcheck="false"></textarea>
      <button type="button" id="copy">Copier les commandes</button>
      <p class="note" id="copy-note"></p>
      <p class="hint">
        Pays et région suivent <code>regions.meshcore.nz</code>.
        Le code départemental est une convention utilisée en France.
        Terminez toujours par <code>region save</code>.
      </p>
    </aside>
    <div id="map"></div>
  </div>
  <script src="vendor/leaflet.js"></script>
  <script src="data/codes.js"></script>
  <script src="app.js"></script>
</body>
</html>
